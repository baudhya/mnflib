[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnflib"
version = "0.1.0"
description = "MNF (Minimum Noise Fraction) Transform for Hyperspectral Image Processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "MNF Developer"}
]
keywords = ["hyperspectral", "mnf", "image-processing", "remote-sensing", "noise-reduction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy",
    "scipy",
    "rasterio",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
    "twine",
]

[project.scripts]
mnf = "mnflib.cli.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/mnflib"
Documentation = "https://github.com/yourusername/mnflib#readme"
Repository = "https://github.com/yourusername/mnflib"
Issues = "https://github.com/yourusername/mnflib/issues"

[tool.setuptools.packages.find]
include = ["mnflib*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
